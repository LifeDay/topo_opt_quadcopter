<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Topo-opt viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d21; color: #e6e6e6;
               font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 8px; right: 8px; pointer-events: none;
         display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #info { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; white-space: pre; }
  #buttons { display: flex; gap: 6px; pointer-events: auto; }
  button { background: rgba(0,0,0,.55); color: inherit; border: 1px solid #555; border-radius: 6px;
           padding: 8px 12px; font: inherit; }
  .stale { color: #f0b429; } .error { color: #ff6b6b; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="hud">
  <div id="info">waiting for latest.stl…</div>
  <div id="buttons"><button id="fit">Fit</button><button id="wire">Edges</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from './vendor/STLLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';

const FILE = new URLSearchParams(location.search).get('file') || 'latest.stl';
const POLL_MS = 5000;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);

// CAD convention: Z up (the print direction).
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1e5);
camera.up.set(0, 0, 1);
camera.position.set(1, -1, 1);
scene.add(camera);
camera.add(sun);  // headlight: the lit side follows the view
sun.position.set(0.3, 0.6, 1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.addEventListener('change', render);
window.viewer = { scene, camera, controls };  // for debugging from the browser console

const material = new THREE.MeshStandardMaterial({ color: 0x5b8fd6, metalness: 0.05, roughness: 0.6,
                                                 side: THREE.DoubleSide });
const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x0b1a2e });
let mesh = null, edges = null, showEdges = false, fitted = false;

function render() { renderer.render(scene, camera); }

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  render();
}
addEventListener('resize', resize);
resize();

function fit() {
  if (!mesh) return;
  const box = new THREE.Box3().setFromObject(mesh);
  const centre = box.getCenter(new THREE.Vector3());
  const radius = box.getBoundingSphere(new THREE.Sphere()).radius || 1;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(centre);
  camera.position.copy(centre).addScaledVector(dir, dist);
  camera.near = dist / 1000; camera.far = dist * 100;
  camera.updateProjectionMatrix();
  controls.update();
  render();
}

function setEdges() {
  if (edges) { scene.remove(edges); edges.geometry.dispose(); edges = null; }
  if (showEdges && mesh) {
    edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 20), edgeMaterial);
    scene.add(edges);
  }
  render();
}

document.getElementById('fit').onclick = fit;
document.getElementById('wire').onclick = () => { showEdges = !showEdges; setEdges(); };

// Replace the geometry only; the camera and controls keep their state.
function show(geometry) {
  geometry.computeVertexNormals();
  if (mesh) { mesh.geometry.dispose(); mesh.geometry = geometry; }
  else { mesh = new THREE.Mesh(geometry, material); scene.add(mesh); }
  setEdges();
  if (!fitted) { fit(); fitted = true; }
  render();
}

const info = document.getElementById('info');
let lastKey = null, lastModified = null, triangles = 0, size = null, status = '';

function updateInfo() {
  const lines = [FILE];
  if (lastModified) {
    const age = Math.round((Date.now() - lastModified) / 1000);
    lines.push(`modified ${lastModified.toLocaleTimeString()}  (${age < 90 ? age + ' s' : Math.round(age / 60) + ' min'} ago)`);
    lines.push(`${triangles.toLocaleString()} triangles` + (size ? `  ·  ${size}` : ''));
  }
  if (status) lines.push(status);
  info.textContent = lines.join('\n');
  info.className = status.startsWith('error') ? 'error' : '';
}

async function poll() {
  try {
    const head = await fetch(FILE, { method: 'HEAD', cache: 'no-store' });
    if (head.status === 404) { status = 'waiting for file…'; return; }
    if (!head.ok) throw new Error(`HTTP ${head.status}`);
    // Last-Modified has 1 s resolution; the length catches two writes in the same second.
    const keyOf = r => `${r.headers.get('Last-Modified')}|${r.headers.get('Content-Length')}`;
    status = '';
    if (keyOf(head) === lastKey) return;
    const res = await fetch(FILE, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geometry = new STLLoader().parse(await res.arrayBuffer());
    lastKey = keyOf(res);
    lastModified = new Date(res.headers.get('Last-Modified') || Date.now());
    triangles = geometry.attributes.position.count / 3;
    geometry.computeBoundingBox();
    const d = geometry.boundingBox.getSize(new THREE.Vector3());
    size = `${d.x.toFixed(1)} × ${d.y.toFixed(1)} × ${d.z.toFixed(1)} mm`;
    show(geometry);
  } catch (err) {
    status = `error: ${err.message}`;
  } finally {
    updateInfo();
  }
}

let timer = null;
function schedule() {
  clearInterval(timer);
  if (document.visibilityState === 'visible') { poll(); timer = setInterval(poll, POLL_MS); }
}
// Stop polling in a background tab (saves the phone's battery); check at once on return.
document.addEventListener('visibilitychange', schedule);
setInterval(updateInfo, 1000);
schedule();
</script>
</body>
</html>
